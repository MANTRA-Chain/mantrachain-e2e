name: E2E Nix Tests Connect
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deploy environment (testnet or canary)'
        required: true
        default: 'canary'
        type: choice
        options:
          - testnet
          - canary

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      matrix:
        tests: [connect]
    env:
      TESTS_TO_RUN: ${{ matrix.tests }}
      ENVS: ${{ secrets.ENVS }}
    environment:
      name: ${{ github.event.inputs.environment }}
    steps:
      - name: Create more disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc "/usr/local/share/boost" "$AGENT_TOOLSDIRECTORY" || true
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
      - name: Install Nix
        uses: cachix/install-nix-action@ba0dd844c9180cbf77aa72a116d6fbc515d0e87b # v27
        with:
          nix_path: nixpkgs=channel:nixos-25.05
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            sandbox = false
      - name: Enable Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Run connect integration tests
        run: make test-connect-e2e-nix
      - name: Tar debug files
        if: failure()
        run: tar cfz debug_files.tar.gz -C "${TMPDIR-/tmp}/pytest-of-runner" . || true
      - name: Upload debug artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-files-connect
          path: debug_files.tar.gz
          if-no-files-found: ignore
